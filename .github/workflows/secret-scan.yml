# Reusable gitleaks scan. Callers:  uses: Spectro-Cloud-FDE/.github/.github/workflows/secret-scan.yml@main
# Uses the gitleaks CLI directly (gitleaks-action needs a paid licence for orgs).
name: secret-scan
on:
  workflow_call:
    inputs:
      gitleaks-version:
        type: string
        default: "8.21.2"
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Install gitleaks
        env:
          V: ${{ inputs.gitleaks-version }}
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Scan
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            gitleaks git --redact --verbose --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" .
          else
            gitleaks git --redact --verbose .
          fi
